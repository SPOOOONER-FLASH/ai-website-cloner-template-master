<div id="hyde-language-slide" aria-label="HYDE Language navigation">
<style>
#hyde-language-slide{--paper:light-dark(#fff,#141716);--ink:light-dark(#161917,#f0f3ef);--muted:light-dark(#636d66,#b0bab3);--line:light-dark(#dce2dc,#3c4640);--soft:light-dark(#f3f5f1,#222b25);--accent:light-dark(#365443,#b9d8c5);--duration:360ms;background:var(--paper);color:var(--ink);font:400 14px/1.5 Arial,Helvetica,sans-serif;min-height:760px;isolation:isolate;}
#hyde-language-slide *{box-sizing:border-box;min-width:0;}
#hyde-language-slide [hidden]{display:none!important;}
#hyde-language-slide h1,#hyde-language-slide h2,#hyde-language-slide p,#hyde-language-slide figure{margin:0;}
#hyde-language-slide button,#hyde-language-slide a{font:inherit;color:inherit;}
#hyde-language-slide button{border:0;background:none;}
#hyde-language-slide a{text-decoration:none;}
#hyde-language-slide .lp-header{position:relative;z-index:3;display:flex;align-items:center;gap:34px;min-height:98px;padding:26px 32px;border-bottom:1px solid var(--line);background:var(--paper);}
#hyde-language-slide .lp-logo{display:flex;align-items:center;min-height:44px;}
#hyde-language-slide .lp-logo img{display:block;width:112px;height:29px;object-fit:contain;}
#hyde-language-slide .lp-nav{display:flex;align-items:center;gap:24px;}
#hyde-language-slide .lp-nav button{min-height:44px;padding:8px 0;white-space:nowrap;}
#hyde-language-slide .lp-nav button:hover{color:var(--accent);}
#hyde-language-slide .lp-language{margin-left:auto;}
#hyde-language-slide .lp-trigger{display:flex;align-items:center;gap:9px;min-height:44px;padding:8px 0;white-space:nowrap;}
#hyde-language-slide .lp-trigger svg:first-child{color:var(--muted);}
#hyde-language-slide .lp-current{font-size:11px;color:var(--muted);margin-left:4px;}
#hyde-language-slide .lp-arrow{display:flex;align-items:center;transition:transform var(--duration) cubic-bezier(.2,.8,.2,1);}
#hyde-language-slide[data-language-open="true"] .lp-arrow{transform:rotate(90deg);}
#hyde-language-slide .lp-panel{position:absolute;top:calc(100% + 12px);right:32px;width:340px;max-width:calc(100% - 64px);padding:24px;background:var(--paper);border:1px solid var(--line);box-shadow:0 16px 36px light-dark(#16261912,#0004);opacity:0;transform:translateX(-24px);clip-path:inset(0 100% 0 0);visibility:hidden;transition:transform var(--duration) cubic-bezier(.2,.8,.2,1),clip-path var(--duration) cubic-bezier(.2,.8,.2,1),opacity 160ms ease,visibility 0s var(--duration);}
#hyde-language-slide[data-language-open="true"] .lp-panel{opacity:1;transform:translateX(0);clip-path:inset(0 0 0 0);visibility:visible;transition:transform var(--duration) cubic-bezier(.2,.8,.2,1),clip-path var(--duration) cubic-bezier(.2,.8,.2,1),opacity 160ms ease,visibility 0s;}
#hyde-language-slide .lp-panel-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:15px;}
#hyde-language-slide .lp-panel h2{font-size:20px;font-weight:400;letter-spacing:-.4px;}
#hyde-language-slide .lp-close{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;margin:-10px -9px -10px 0;}
#hyde-language-slide .lp-languages{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;}
#hyde-language-slide .lp-languages button{position:relative;min-height:48px;padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border-bottom:1px solid var(--line);}
#hyde-language-slide .lp-languages button:hover{color:var(--accent);}
#hyde-language-slide .lp-languages button[aria-pressed="true"]{color:var(--accent);}
#hyde-language-slide .lp-languages small{font-size:11px;color:var(--muted);}
#hyde-language-slide .lp-languages .lp-check{display:none;position:absolute;left:0;bottom:1px;height:2px;width:22px;background:var(--accent);}
#hyde-language-slide .lp-languages button[aria-pressed="true"] .lp-check{display:block;}
#hyde-language-slide .lp-layout{display:grid;grid-template-columns:minmax(0,1fr) 184px;gap:44px;padding:54px 32px 42px;min-height:610px;}
#hyde-language-slide .lp-main{align-self:center;}
#hyde-language-slide .lp-home{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center;}
#hyde-language-slide .lp-home h1{font-size:38px;line-height:1.08;font-weight:400;letter-spacing:-1.1px;max-width:8em;}
#hyde-language-slide .lp-eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:22px!important;}
#hyde-language-slide .lp-home p:not(.lp-eyebrow){margin-top:22px;color:var(--muted);font-size:13px;max-width:26em;}
#hyde-language-slide .lp-home figure{background:#fff;aspect-ratio:1;}
#hyde-language-slide .lp-home img{display:block;width:100%;height:100%;object-fit:contain;}
#hyde-language-slide .lp-support{border-left:1px solid var(--line);padding-left:22px;align-self:center;}
#hyde-language-slide .lp-support>p{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
#hyde-language-slide .lp-support button{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:76px;padding:16px 0;width:100%;text-align:left;border-bottom:1px solid var(--line);font-size:16px;}
#hyde-language-slide .lp-support button small{display:block;color:var(--muted);font-size:11px;margin-top:6px;}
#hyde-language-slide .lp-support .lp-contact{background:var(--ink);color:var(--paper);padding:14px;margin-top:19px;min-height:48px;font-size:12px;}
#hyde-language-slide .lp-detail h1{font-size:36px;line-height:1.1;letter-spacing:-1px;font-weight:400;margin-bottom:24px;}
#hyde-language-slide .lp-detail p:not(.lp-eyebrow){color:var(--muted);max-width:36em;}
#hyde-language-slide .lp-detail button{margin-top:30px;min-height:44px;display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ink);}
#hyde-language-slide .lp-footer{display:flex;justify-content:space-between;gap:20px;padding:18px 32px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}
#hyde-language-slide .lp-announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:850px){
 #hyde-language-slide .lp-header{gap:22px;padding-inline:24px;}
 #hyde-language-slide .lp-nav{gap:18px;}
 #hyde-language-slide .lp-panel{right:24px;max-width:calc(100% - 48px);}
 #hyde-language-slide .lp-layout{padding-inline:24px;gap:24px;grid-template-columns:minmax(0,1fr) 164px;}
 #hyde-language-slide .lp-home{grid-template-columns:1fr;gap:18px;}
 #hyde-language-slide .lp-home figure{order:-1;aspect-ratio:1.8;}
 #hyde-language-slide .lp-home h1{max-width:14em;font-size:33px;}
 #hyde-language-slide .lp-home p:not(.lp-eyebrow){margin-top:16px;}
}
@media(max-width:720px){
 #hyde-language-slide .lp-header{flex-wrap:wrap;gap:10px 16px;}
 #hyde-language-slide .lp-nav{order:3;width:100%;justify-content:flex-start;gap:24px;}
 #hyde-language-slide .lp-layout{grid-template-columns:1fr;}
 #hyde-language-slide .lp-support{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-left:0;border-bottom:1px solid var(--line);padding:0 0 22px;order:-1;}
 #hyde-language-slide .lp-support>p{grid-column:1/-1;margin-bottom:0;}
 #hyde-language-slide .lp-support button{font-size:13px;align-items:start;min-height:70px;}
 #hyde-language-slide .lp-support button svg{display:none;}
 #hyde-language-slide .lp-support .lp-contact{margin-top:0;font-size:12px;padding:12px;align-items:center;}
 #hyde-language-slide .lp-home{grid-template-columns:1fr 1fr;}
 #hyde-language-slide .lp-home figure{order:0;aspect-ratio:1;}
}
@media(max-width:480px){
 #hyde-language-slide{min-height:1030px;}
 #hyde-language-slide .lp-header{padding:18px 16px;}
 #hyde-language-slide .lp-logo img{width:96px;height:26px;}
 #hyde-language-slide .lp-nav{gap:18px;font-size:12px;}
 #hyde-language-slide .lp-trigger{font-size:13px;gap:7px;}
 #hyde-language-slide .lp-panel{right:16px;max-width:calc(100% - 32px);padding:20px;transform:translateX(-12px);}
 #hyde-language-slide .lp-languages{gap:4px 15px;}
 #hyde-language-slide .lp-languages button{font-size:13px;gap:7px;}
 #hyde-language-slide .lp-layout{padding:30px 16px 40px;gap:42px;}
 #hyde-language-slide .lp-support{gap:9px;}
 #hyde-language-slide .lp-support .lp-contact{padding:10px 6px;}
 #hyde-language-slide .lp-home{grid-template-columns:1fr;}
 #hyde-language-slide .lp-home figure{order:-1;aspect-ratio:1.25;}
 #hyde-language-slide .lp-home h1{font-size:33px;}
 #hyde-language-slide .lp-detail h1{font-size:31px;}
 #hyde-language-slide .lp-footer{padding:16px;flex-wrap:wrap;gap:8px;}
}
@media(prefers-reduced-motion:reduce){#hyde-language-slide .lp-panel,#hyde-language-slide .lp-arrow{transition:none!important;transform:none!important;}}
</style>
<header class="lp-header">
 <a class="lp-logo" href="#home" data-page="home" aria-label="HYDE homepage"><img data-image="logo" alt="HYDE" width="112" height="29"></a>
 <nav class="lp-nav" aria-label="Main navigation"><button type="button" class="cursor-interaction" data-page="products">Products</button><button type="button" class="cursor-interaction" data-page="applications">Applications</button><button type="button" class="cursor-interaction" data-page="factory">Factory & OEM</button></nav>
 <div class="lp-language">
  <button type="button" class="lp-trigger cursor-interaction" data-language-trigger aria-expanded="false" aria-controls="hyde-language-panel"><i data-lucide="globe" aria-hidden="true"></i><span>Language</span><span class="lp-current" data-current>EN</span><span class="lp-arrow"><i data-lucide="chevron-right" aria-hidden="true"></i></span></button>
  <section id="hyde-language-panel" class="lp-panel" aria-labelledby="hyde-language-heading" hidden inert>
   <div class="lp-panel-top"><h2 id="hyde-language-heading">Language</h2><button type="button" class="lp-close cursor-interaction" data-close-language aria-label="Close language panel"><i data-lucide="x" aria-hidden="true"></i></button></div>
   <div class="lp-languages">
    <button type="button" class="cursor-interaction" data-locale="ES" aria-pressed="false"><span lang="es">Español</span><small>ES</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="PT" aria-pressed="false"><span lang="pt">Português</span><small>PT</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="FR" aria-pressed="false"><span lang="fr">Français</span><small>FR</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="DE" aria-pressed="false"><span lang="de">Deutsch</span><small>DE</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="JA" aria-pressed="false"><span lang="ja">日本語</span><small>JA</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="KO" aria-pressed="false"><span lang="ko">한국어</span><small>KO</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="TR" aria-pressed="false"><span lang="tr">Türkçe</span><small>TR</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="RU" aria-pressed="false"><span lang="ru">Русский</span><small>RU</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="AR" aria-pressed="false"><span lang="ar" dir="rtl">العربية</span><small>AR</small><span class="lp-check" aria-hidden="true"></span></button>
    <button type="button" class="cursor-interaction" data-locale="EN" aria-pressed="true"><span lang="en">English</span><small>EN</small><span class="lp-check" aria-hidden="true"></span></button>
   </div>
  </section>
 </div>
</header>
<div class="lp-layout">
 <main class="lp-main" data-main></main>
 <nav class="lp-support" aria-label="Files and support"><p>Files & support</p><button type="button" class="cursor-interaction" data-page="downloads"><span>Catalog PDF<small>HYDE 2026 · English</small></span><i data-lucide="arrow-down-right" aria-hidden="true"></i></button><button type="button" class="cursor-interaction" data-page="documents"><span>Documents<small>Drawings & test reports</small></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button><button type="button" class="lp-contact cursor-interaction" data-page="contact">Ask an engineer<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></nav>
</div>
<footer class="lp-footer"><span>HYDE · Canton Hyland</span><span>Architectural door hardware</span></footer>
<div class="lp-announcement" aria-live="polite" data-announcement></div>
<template data-home><div class="lp-home"><div><p class="lp-eyebrow">HYDE · Stainless steel handles</p><h1>A considered detail.<br>The 9001 lever.</h1><p>Explore the product range, read the technical detail and talk to the people who make it.</p></div><figure><img data-image="lever" alt="Actual 9001 stainless steel lever and escutcheon" width="1200" height="800"></figure></div></template>
<template data-asset="logoLight">__LOGO_LIGHT__</template><template data-asset="logoDark">__LOGO_DARK__</template><template data-asset="lever">__LEVER_PHOTO__</template>
<script>
(() => {
 const root=document.getElementById('hyde-language-slide');if(!root)return;
 const trigger=root.querySelector('[data-language-trigger]');const panel=root.querySelector('.lp-panel');const main=root.querySelector('[data-main]');
 const locales=Array.from(root.querySelectorAll('[data-locale]'));const codes=locales.map(button=>button.dataset.locale);
 const assets=Object.fromEntries(Array.from(root.querySelectorAll('[data-asset]')).map(t=>[t.dataset.asset,t.content.textContent.trim()]));
 const dark=window.matchMedia('(prefers-color-scheme:dark)');const reduced=window.matchMedia('(prefers-reduced-motion:reduce)');
 const settings={duration:360};let current='EN';let open=false;let hideTimer;let openFrame;
 const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});};
 const paintImages=()=>root.querySelectorAll('img[data-image]').forEach(img=>{img.src=img.dataset.image==='logo'?assets[dark.matches?'logoDark':'logoLight']:assets[img.dataset.image];});
 const paintLanguage=()=>{root.querySelector('[data-current]').textContent=current;locales.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.locale===current)));};
 const save=()=>{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{languageNavigation:'Language with rightward reveal',previewLanguage:current},privateContent:null})).catch(()=>{});};
 const setOpen=(next,restore=false,focus=false)=>{
  if(open===next)return;open=next;clearTimeout(hideTimer);cancelAnimationFrame(openFrame);trigger.setAttribute('aria-expanded',String(open));
  if(open){panel.hidden=false;panel.inert=false;panel.removeAttribute('aria-hidden');openFrame=requestAnimationFrame(()=>{root.dataset.languageOpen='true';if(focus)(locales.find(button=>button.dataset.locale===current)||locales[0]).focus({preventScroll:true});});}
  else{root.dataset.languageOpen='false';panel.inert=true;panel.setAttribute('aria-hidden','true');if(restore)trigger.focus({preventScroll:true});hideTimer=setTimeout(()=>{if(!open)panel.hidden=true;},reduced.matches?0:settings.duration);}
 };
 const descriptions={products:['Products','Find the right hardware.','Explore the product families, then check the exact model and its published specification.'],applications:['Applications','Hardware in context.','Browse hardware for residential, hospitality and commercial doors.'],factory:['Factory & OEM','People behind the product.','Discuss your model, finish and project requirements with the export team.'],downloads:['Downloads','HYDE Product Catalog 2026','The English product catalog, with product families and published specifications.'],documents:['Documents','Technical documents & drawings','Use the published document for the exact model you are specifying.'],contact:['Contact','Talk to an export engineer.','tec@cantonlock.com']};
 const paintPage=key=>{if(key==='home'){main.replaceChildren(root.querySelector('[data-home]').content.cloneNode(true));paintImages();return;}const data=descriptions[key];if(!data)return;const section=document.createElement('div');section.className='lp-detail';const eyebrow=document.createElement('p');eyebrow.className='lp-eyebrow';eyebrow.textContent='HYDE / '+data[0];const h1=document.createElement('h1');h1.textContent=data[1];const p=document.createElement('p');p.textContent=data[2];const back=document.createElement('button');back.type='button';back.className='cursor-interaction';back.dataset.page='home';back.textContent='Back to HYDE';const icon=document.createElement('i');icon.dataset.lucide='arrow-left';icon.setAttribute('aria-hidden','true');back.prepend(icon);section.append(eyebrow,h1,p,back);main.replaceChildren(section);icons();};
 const applySaved=state=>{const code=state?.modelContent?.previewLanguage;if(codes.includes(code)){current=code;paintLanguage();}};
 paintPage('home');paintLanguage();applySaved(window.openai?.widgetState);dark.addEventListener('change',paintImages);
 window.addEventListener('openai:set_globals',event=>applySaved(event.detail?.globals?.widgetState));
 root.addEventListener('click',event=>{const button=event.target.closest('button,a');if(!button||!root.contains(button))return;if(button.hasAttribute('data-language-trigger')){setOpen(!open,true,true);return;}if(button.hasAttribute('data-close-language')){setOpen(false,true);return;}if(button.dataset.locale){current=button.dataset.locale;paintLanguage();setOpen(false,true);root.querySelector('[data-announcement]').textContent='Preview language selection: '+button.querySelector('span').textContent;save();return;}if(button.dataset.page){event.preventDefault();const moved=main.contains(button);setOpen(false);paintPage(button.dataset.page);if(moved)root.querySelector('.lp-logo').focus({preventScroll:true});}});
 document.addEventListener('pointerdown',event=>{if(open&&!root.querySelector('.lp-language').contains(event.target))setOpen(false);});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&open){event.preventDefault();setOpen(false,true);}});
 document.addEventListener('focusin',event=>{if(open&&!root.querySelector('.lp-language').contains(event.target))setOpen(false);});
 const update=()=>root.style.setProperty('--duration',settings.duration+'ms');update();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:update});tweak.addSlider(settings,'duration',{label:'展开时长',min:240,max:520,step:20,unit:'ms'});}
})();
</script>
</div>
