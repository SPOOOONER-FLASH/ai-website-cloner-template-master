# Cantonlock catalogue taxonomy redirects.
#
# Keep these as real HTTP redirects at the origin. The static export also ships
# a browser-side Next redirect document for each retired path, but crawlers and
# non-JavaScript clients should receive the canonical destination immediately.

location = /products/door-hinges {
    return 301 /products/brass-steel-hinges/;
}

location = /products/door-hinges/ {
    return 301 /products/brass-steel-hinges/;
}

location = /products/door-hinges/f100-ss-door-hinge {
    return 301 /products/brass-steel-hinges/f100-ss-door-hinge/;
}

location = /products/door-hinges/f100-ss-door-hinge/ {
    return 301 /products/brass-steel-hinges/f100-ss-door-hinge/;
}

location = /products/door-hinges/stainless-steel-door-hinge {
    return 301 /products/brass-steel-hinges/stainless-steel-door-hinge/;
}

location = /products/door-hinges/stainless-steel-door-hinge/ {
    return 301 /products/brass-steel-hinges/stainless-steel-door-hinge/;
}
