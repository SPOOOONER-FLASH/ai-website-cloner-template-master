# 静态资源的浏览器缓存头 —— 2026-09-30，Lighthouse「Use efficient cache lifetimes」
#
# 装在 server 块里（宝塔：/www/server/panel/vhost/nginx/extension/cantonlock.com/20-static-cache.conf，
# 该目录已被主配置 include）。装完 `nginx -t` 再 `nginx -s reload`；见 CLIENT-RUNBOOK 第一屏。
#
# 为什么：/_next/static/ 下每个文件名都带内容哈希，改一个字节就换一个名字，所以可以让浏览器
# 缓存一年且永不重新验证（immutable）。图片、字体、PDF 没有哈希但极少改，30 天。HTML 不在这里
# —— 它由 Cloudflare 的边缘规则管（1 天），浏览器按源站，源站不发就是每次回源校验，正确。
#
# 2026-09-29 的 PageSpeed 把 171 KB（桌面）/ 130 KB（移动）的资源记为「缓存时间短」：宝塔默认
# 不发 Cache-Control，Cloudflare 在没有源站头时给静态类型补 max-age=14400（4 小时）。
# 在 Cloudflare 里「Browser Cache TTL」保持「Respect Existing Headers」即可，源站发了它就照转。

location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|pdf|mp4|webm)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
