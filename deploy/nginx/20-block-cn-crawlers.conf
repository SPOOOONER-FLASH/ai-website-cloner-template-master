# 拒绝中国搜索引擎 / AI 公司的爬虫，以及常见的批量抓取库。客户要求，2026-10-16：
# 「防止中国 AI 爬取……不让别人中国公司来偷取我的架构和成果」。
#
# 安装位置：/www/server/panel/vhost/nginx/extension/cantonlock.com/20-block-cn-crawlers.conf
# （被 include 进 cantonlock.com 的 server 块，只影响 cantonlock.com，不影响 rayen.cn）。
# 安装命令：sudo bash deploy/install-nginx-redirects.sh（会先 nginx -t，失败自动回滚）。
#
# 名单和 robots.txt 同源：src/lib/seo-policy.ts 的 BLOCKED_CRAWLERS。seo-policy.test.ts 会检查
# 这里每个名字都在，漏一个测试就失败。
#
# 这是第二道防线。第一道是 Cloudflare 的防火墙规则（见
# docs/collaboration/archive/2026-10-16-手动操作-屏蔽中国AI爬虫.md）：Cloudflare 缓存命中的页面根本
# 不会到这台服务器，只有在 Cloudflare 那一层拦，才拦得住全部请求。
#
# 故意不拦的：
#   curl / wget —— 我们自己的部署验证（本目录的安装脚本）和日常 curl -sI 检查都用它；
#   node —— scripts/ 下的线上审计脚本用 Node 自带的 fetch；
#   HeadlessChrome —— Lighthouse / PageSpeed 和我们的 Playwright 检查会用到。
#   GPTBot、ClaudeBot、PerplexityBot、Googlebot、Bingbot 等 —— 它们是买家找到我们的渠道（GEO）。

if ($http_user_agent ~* "(Bytespider|TikTokSpider|Baiduspider|YisouSpider|Sogou web spider|Sogou|360Spider|HaosouSpider|PetalBot|ChatGLM-Spider|DeepSeekBot|KimiBot|Kimi-SearchBot|Kimi-User|Scrapy|python-requests|python-urllib|aiohttp|Go-http-client)") {
    return 403;
}
