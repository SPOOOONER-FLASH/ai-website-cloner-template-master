# 服务器 nginx 现状快照（2026-08-30，已验证生效）

# ⚠ 这是线上配置的只读快照，用于对齐认知，不要整文件覆盖服务器。
# 服务器主配置文件：/www/server/panel/vhost/nginx/cantonlock.com.conf
# 快照来源：宝塔「配置文件」页实录 + 当日 curl 线上验证。

# ── 1. www → 裸域 301 ────────────────────────────────────────────
# 位于 server 块内、root 行之后。2026-08-30 新增。
# 此前 server_name 同时挂两个域名导致 www 直接发 200，靠 canonical 兜底。
if ($host = www.cantonlock.com) {
    return 301 https://cantonlock.com$request_uri;
}

# ── 2. 旧 DedeCMS URL 301（大小写不敏感）────────────────────────
# 2026-08-30 由 location = /index.php 改为 ~*，修复大写 Index.php 硬 404
#（Bing 索引的 72 条旧 URL 里 39 条是大写 I）。
# map 变量定义在 http 层的 /www/server/panel/vhost/nginx/0.legacy-redirects.conf
#（对应本仓库 deploy/nginx/legacy-redirects.conf）。
location ~* ^/index\.php$ {
    if ($legacy_product_url != "")  { return 301 $legacy_lang_prefix$legacy_product_url; }
    if ($legacy_category_url != "") { return 301 $legacy_lang_prefix$legacy_category_url; }
    return 301 $legacy_lang_home$legacy_fallback_path;
}

# ── 2b. 2026-09-04 待手工更新 ───────────────────────────────────
# 上面那段是**应有**的版本；服务器上目前仍是旧版：
#     if ($legacy_product_url != "") { return 301 $legacy_product_url; }
#     if ($legacy_category_url != "") { return 301 $legacy_category_url; }
#     return 301 /products/;
#
# 为什么要改 —— 两条都来自 2026-09-04 的 Search Console 导出：
#
# 1) index.php?lang=es 有 31 次展示、平均排名 4.97，是全站排名最好的 URL 之一，
#    而它是**旧的西班牙语首页**，此前 301 到英文的 /products/。西语买家从西语结果
#    点进来，落在英文栏目页 —— 访客和排名一起浪费。
#    $legacy_lang_prefix 把语言带到 aid/tid 解析出的目标上，所以旧的西语类目 URL
#    会落到西语类目页。map 输出的每一个目标都有西语镜像，加前缀是安全的。
#
# 2) 光秃秃的 index.php 是**旧首页**，此前也被送到 /products/。那是在回答没人问的
#    问题，还丢掉了首页自己积累的排名。现在按 $arg_aid$arg_tid 是否为空来区分：
#    有参数但没解析出来 → /products/（最接近的诚实答案）；什么都没有 → 首页。
#
# 三个 map 变量都已经在 deploy/nginx/legacy-redirects.conf 里生成好，由
# deploy/install-nginx-redirects.sh 安装。**只有这个 location 块要手工改**，
# 因为它在宝塔管理的主 vhost 文件里，安装脚本不碰它。
# 逐步操作见 docs/collaboration/CLIENT-RUNBOOK.md。

# ── 3. 服务器上相关文件清单 ─────────────────────────────────────
# /www/server/panel/vhost/nginx/0.legacy-redirects.conf
#   aid（423 条产品）+ tid（11 条类目）两段 map。2026-08-30 补上 tid 段
#  （旧版只有一个全 fallback 的空壳 stub，已删）。与本仓库
#   deploy/nginx/legacy-redirects.conf 一致。
# /www/server/panel/vhost/nginx/extension/cantonlock.com/
#   10-taxonomy-redirects.conf（类目别名列举，2026-08-28）
#   cache.conf（三段缓存策略，2026-08-26；另有 .bak/.bak2）
#   site_total.conf
# ※ extension 目录被 include 进 server 块，map 指令不能放这里。

# ── 4. 运维备忘 ─────────────────────────────────────────────────
# - 改任何 301/跳转后必须清 Cloudflare 缓存（CF 会缓存 301 响应，
#   本次 tid=97 的旧跳转被缓存了 50 分钟，Purge 后才生效）。
# - 宝塔「配置文件」页保存会自动 nginx -t；手动改其他文件后跑
#   nginx -t && nginx -s reload。
# - Let's Encrypt 续期不受 301 影响（LE 会跟随跳转取验证文件）。

