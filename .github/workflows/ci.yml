name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The suite existed but nothing ran it, so a failing assertion could sit in the
      # repository unnoticed — which is how the promo timing got changed twice without
      # anyone being told. It runs before the build because it is the faster signal.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Same order as `npm run deploy:prep`. The build renders the legacy product URLs
      # (buildableLegacyProductParams) as redirect stubs carrying Next's error mark; the
      # release deletes them because nginx 301s those URLs first. Without this step the
      # --check in test:export fails on pages no release would ever ship.
      - name: Prune stale exports
        run: node scripts/prune-stale-exports.mjs --write

      - name: Verify the fresh static export
        run: npm run test:export
