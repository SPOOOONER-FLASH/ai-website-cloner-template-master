<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 46" role="img" aria-label="ISO 9001 certification mark">
  <!--
    Signature slot. Monochrome, flat, no gradients or shadows — matches the site's colour
    rules. Drawn as vector so it stays crisp at any size. Colour is inherited via
    currentColor, matching the primary ink token.

    This file is served publicly, so the rationale for holding one mark rather than two
    lives beside the MediaPlaceholder in src/components/site/WelcomeIntro.tsx. Only add a
    mark back when a certificate exists for it.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="0.5" y="8.5" width="40" height="29" />
  </g>
  <g fill="currentColor" font-family="Archivo, sans-serif" text-anchor="middle">
    <text x="20.5" y="21" font-size="8" font-weight="700" letter-spacing="0.2">ISO</text>
    <text x="20.5" y="31" font-size="8" font-weight="400" letter-spacing="0.2">9001</text>
  </g>
</svg>
